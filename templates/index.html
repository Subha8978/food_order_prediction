<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Food Order Prediction</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f9f9f9;
            padding: 40px;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0px 0px 10px #ccc;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        h2, h3 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Will You Order Food Online?</h2>
    <form action="/predict" method="POST">
        Age: <input type="number" name="age" required>
        
        Gender:
        <select name="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        Marital Status:
        <select name="marital_status" required>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
        </select>

        Income: <input type="number" name="income" required>

        Occupation:
        <select name="occupation" required>
            <option value="Student">Student</option>
            <option value="Professional">Professional</option>
            <option value="Other">Other</option>
        </select>

        Educational Qualification:
        <select name="education" required>
            <option value="Undergraduate">Undergraduate</option>
            <option value="Graduate">Graduate</option>
            <option value="Postgraduate">Postgraduate</option>
        </select>

        Family Size: <input type="number" name="family_size" required>
        Review of previous order: <input type="number" name="review" required>
        Pincode: <input type="number" name="pincode" required>

        <input type="submit" value="Predict">
    </form>

    <h3>{{ prediction_text }}</h3>
</body>
</html>
